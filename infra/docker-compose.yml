services:
  postgres:
    image: postgres:16-alpine
    container_name: uptime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime_secret
      POSTGRES_DB: uptime_db
    ports:
      # Host port movido de 5432 -> 5433: no Windows, 5432 frequentemente
      # cai numa faixa de portas excluída pelo Hyper-V/WSL2 (bind falha com
      # erro de permissão, mesmo sem nenhum outro processo usando a porta).
      # A porta dentro do container continua 5432 normalmente.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uptime_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
